name: Upstream Sync Check

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am UTC
  workflow_dispatch:  # Manual trigger

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/RichardAtCT/claude-code-telegram.git
          git fetch upstream main

      - name: Check for upstream changes
        id: check
        run: |
          BEHIND=$(git rev-list --count personal..upstream/main)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          if [ "$BEHIND" -gt 0 ]; then
            echo "Upstream has $BEHIND new commits"
            git log --oneline personal..upstream/main | head -20
          else
            echo "Already up to date"
          fi

      - name: Create sync PR if behind
        if: steps.check.outputs.behind > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH_NAME="sync/upstream-$(date +%Y%m%d)"
          git checkout -b "$BRANCH_NAME"
          git merge upstream/main --no-edit || true

          git push origin HEAD
          gh pr create \
            --base personal \
            --title "sync: merge upstream changes ($(date +%Y-%m-%d))" \
            --body "Automated upstream sync. ${{ steps.check.outputs.behind }} new commits from upstream.

          Review the changes and resolve any conflicts before merging." \
            --label "upstream-sync" || echo "PR already exists"
